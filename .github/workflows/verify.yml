name: Verify Server

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc

    - name: Rebuild from pinned commits
      run: npm run rebuild

    - name: Start the server and check it answers
      run: npm run smoke
